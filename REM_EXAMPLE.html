<!DOCTYPE html>
<html>
<head>
    <title>REM Example</title>

    <style>
        html {             font-size: 16px;         }
        h1 {             font-size: 2rem;         }
        p {             font-size: 1.5rem;         }
        h2 {             font-size: 1rem;         }
    </style>
</head>
<body>
    <h1>Welcome to CSS</h1>
    <p>This is a paragraph using 1.5rem.</p>
    <h2>This is a heading using 1rem.</h2>
</body>
</html>
